services:
  api:
    build: .
    container_name: multimodal-rag
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - CHROMA_PERSIST_DIR=/data/chroma
      - STORAGE_DIR=/data/storage
    volumes:
      # Persist the vector DB and stored images across restarts.
      - rag_data:/data
      # Cache downloaded models between rebuilds.
      - hf_cache:/models
    restart: unless-stopped

volumes:
  rag_data:
  hf_cache:

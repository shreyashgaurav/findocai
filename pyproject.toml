[project]
name = "findocai"
version = "0.1.0"
description = "Multimodal RAG over SEC filings and earnings decks, with page-level citations"
readme = "README.md"
authors = [
    { name = "Shreyash Gaurav", email = "shreyash2856@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "google-genai>=2.30.1",
    "lxml>=6.1.3",
    "pymupdf>=2.1",
    "pyyaml>=6.0.3",
    "sentence-transformers",
    "torch",
]

[project.scripts]
findocai = "findocai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]


# Get PyTorch from its CPU-only index - as I have no GPU
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  
#use this index only for packages pointed at it (torch)
